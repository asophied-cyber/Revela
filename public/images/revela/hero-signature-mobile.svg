<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
<title id="title">Emplacement éditorial RÉVÉLA</title><desc id="desc">Un horizon lumineux abstrait réservé au futur visuel photographique.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#121a43"/><stop offset=".58" stop-color="#7d84b8"/><stop offset="1" stop-color="#efc6b8"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fff"/><stop offset=".18" stop-color="#ffd5c4" stop-opacity=".92"/><stop offset="1" stop-color="#ffd5c4" stop-opacity="0"/></radialGradient>
 <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7d83b4"/><stop offset="1" stop-color="#161d46"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="800" height="1200" fill="url(#sky)"/>
