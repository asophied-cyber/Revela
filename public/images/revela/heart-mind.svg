<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
<title id="title">Emplacement éditorial RÉVÉLA</title><desc id="desc">Un horizon lumineux abstrait réservé au futur visuel photographique.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18204d"/><stop offset=".58" stop-color="#7374a7"/><stop offset="1" stop-color="#efc6b8"/></linearGradient>
